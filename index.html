<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A private workspace for every application, résumé version, and cover letter. Built for any role and any AI assistant."
    />
    <meta name="theme-color" content="#003fcc" />
    <title>unmplyd — A place for every version</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="src/styles.css" />
    <script defer src="vendor/jspdf.umd.min.js"></script>
    <script defer src="vendor/mammoth.browser.min.js"></script>
  </head>
  <body>
    <a href="#main" class="skip-link visually-hidden">Skip to main content</a>
    <div id="app">
      <div style="padding: 50px; font-family: system-ui">
        Opening your workspace…
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      >This workspace needs JavaScript to save and organize your documents. Your
      existing data stays untouched.</noscript
    >
    <script type="module">
      import * as pdfjsLib from "./vendor/pdf.min.mjs";
      window.pdfjsLib = pdfjsLib;
      await import("./src/app.js");
    </script>
  </body>
</html>
